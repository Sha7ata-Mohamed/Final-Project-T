<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>index</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'index.css' %}">
</head>

<body class="login flex flex-col items-center justify-center min-h-screen">
  <div class="text-center">
    <h1 class="codemix-title">
      <span class="code-part">CODE</span><span class="dash-part">-</span><span class="mix-part">MIX</span>
    </h1>

    {% if user.is_authenticated %}
    <div class="login-form">
      <h2 class="auth-welcome">Welcome, {{ user.username }}!</h2>
      <form method="post" action="{% url 'account_logout' %}" class="mb-4">
        {% csrf_token %}
        <button type="submit" class="lf--submit">Log Out</button>
      </form>
      <a href="{% url 'home' %}" class="lf--submit auth-link inline">Go to Website</a>
    </div>
    {% else %}
    <div class="login-form">
      <h2 class="auth-welcome">You are not logged in</h2>
      <p class="auth-description">Please log in or sign up to access all features.</p>
      
      <div class="d-flex flex-column align-items-center gap-3">
        <a href="{% url 'account_signup' %}" class="lf--submit auth-link">Sign Up</a>
        <a href="{% url 'account_login' %}?next={% url 'home' %}" class="lf--submit auth-link">Log In</a>
        <a href="{% url 'account_reset_password' %}" class="forgot-link">Reset Password</a>
      </div>
    </div>
    {% endif %}
  </div>
  <script src="{% static 'js/index.js' %}"></script>
</body>
</html>
